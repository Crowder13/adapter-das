[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-kernel"
version = "0.1.0"
description = "Triton-backed drop-in replacement of sgl_kernel for HCU (Hygon HCU). Provides the AOT kernel backend (`import sgl_kernel`) consumed by sglang's `sglang.kernels` fused-op layer, so upstream sglang runs on HCU without any code modification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "packaging>=23",
    "torch==2.11.0",
    "triton==3.6.0",
]

[project.optional-dependencies]
# Official sglang v0.5.22 runtime deps, platform-neutral subset only.
# CUDA-only deps (sglang-kernel, flash-attn-4, flashinfer_python, ...) must stay out.
# Keep in sync with upstream python/pyproject.toml; see docs/image-dtk2610.md §2.
# Install: pip install "$(ls /wheels/sgl_kernel-*.whl)[sglang-runtime]"
sglang-runtime = [
    # 服务框架与调度
    "aiohttp",
    "fastapi",
    "uvicorn>=0.51",
    "uvloop",
    "watchfiles",
    "pyzmq>=25.1.2",
    "orjson",
    "msgspec",
    "setproctitle",
    "psutil",
    "prometheus-client>=0.20.0",
    # 模型/词表/结构化输出
    "transformers==5.19.0",
    "tokenizers==0.23.2",
    "sentencepiece==0.2.1",
    "tiktoken",
    "blobfile==3.0.0",
    "gguf",
    "compressed-tensors==0.18.0",
    "outlines==0.1.11",
    "xgrammar==0.2.7",
    "llguidance>=1.7.6,<2.0.0",
    "interegular",
    "partial_json_parser",
    "einops",
    # 推理客户端/生态胶水
    "openai==2.8.0",
    "anthropic>=0.20.0",
    "mistral_common>=1.11.5",
    "modelscope",
    "datasets",
    "huggingface-hub",
    "requests",
    "tqdm",
    "openai-harmony==0.0.4",
    # 科学计算/媒体/杂项
    "numpy",
    "scipy",
    "numba==0.65.1",
    "pillow",
    "soundfile==0.13.1",
    "timm==1.0.25",
    "kernels>=0.14.1,<0.15",
    "regex",
    "pybase64",
    "pydantic",
    "python-dateutil<3",
    "python-multipart",
    "distro",
    "easydict",
    "xxhash",
    "zstandard",
    "ninja",
    "build",
    "IPython",
    "py-spy",
    # 多模态（torch_memory_saver 条件项，不进 extra，见文档）
    "smg-grpc-servicer>=0.9.0",
    "deepseek-recipe==0.2.0",
    "tml-renderers==0.1.0",
    # 纯绑定 CUDA 包（只为官方 CUDA-only 分支的 import 探测通过）
    "cuda-bindings==13.4.4",
    "nvidia-cutlass-dsl==4.8.1",
]
# Official sglang v0.5.22 `diffusion` extra, platform-neutral subset only.
# CUDA-only 排除项：nvidia-modelopt / runai_model_streamer / st_attn / vsa（均惰性
# import，缺包只影响对应 optional backend/loader，不挡 import 面）。未在 HCU 实测——
# 本 extra 只打开上游 diffusion 入口，不代表 serving 已验证。
# 与上游的偏离：opencv-python-headless 由 ==4.10.0.84 放宽为 >=4.13.0——上游钉值
# 与 resident vllm（要求 >=4.13.0）无交集；diffusion 代码只用跨版本稳定的 cv2 API。
# Keep in sync with upstream python/pyproject.toml; see docs/image-dtk2610.md §2/§7.
# Install: pip install "$(ls /wheels/sgl_kernel-*.whl)[sglang-diffusion]"
sglang-diffusion = [
    "addict==2.4.0",
    "av==16.1.0",
    "cache-dit==1.5.1",
    "cloudpickle==3.1.2",
    "diffusers==0.37.0",
    "imageio==2.36.0",
    "imageio-ffmpeg==0.5.1",
    "moviepy>=2.0.0",
    "msgpack",
    "opencv-python-headless>=4.13.0",
    "PyYAML==6.0.1",
    "remote-pdb==2.1.0",
    "scikit-image==0.25.2",
    "trimesh>=4.0.0",
    "websockets",
    "xatlas",
]
# HCU DTK vendor runtime stack（镜像/栈迁移预装，见 docs/image-dtk2610.md §1.5）。
# 定位是"环境自检清单"：pip install "$(ls /wheels/sgl_kernel-*.whl)[hcu-runtime]" 时，
# 已装的 DTK 本地版 wheel（+dtk2610...）直接满足这些无钉要求。务必在 §1.5 栈迁移
# 之后使用——裸环境下 pip 会去 PyPI 拉同名 CUDA 构建（torch/triton/vllm/aiter 等），
# 这不是本 extra 的意图。版本由镜像/栈迁移统一管理，故此处不钉。
hcu-runtime = [
    "aiter",
    "boltops",
    "causal_conv1d",
    "deep_ep",
    "deepgemm",
    "fastsafetensors",
    "flash_attn",
    "flash_kda",
    "flash_mla",
    "lightop",
    "lmcache",
    "lmslim",
    "mooncake-transfer-engine",
    "nixl",
    "tilelang",
    "torchvision",
    "vllm",
]
test = [
    "pytest",
    "tomli>=1.1; python_version < '3.11'",
]

[project.entry-points."vllm.platform_plugins"]
hcu_adapter = "hcu_adapter.bridges.vllm:hcu_platform_plugin"

[project.entry-points."vllm.general_plugins"]
hcu_adapter = "hcu_adapter.bridges.vllm:hcu_runtime_plugin"

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.packages.find]
include = ["hcu_adapter*", "sgl_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
